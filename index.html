<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="PrepHub brings interview practice, study planning, application tracking, outreach, and job opportunities together."
    />
    <meta name="theme-color" content="#f7f8fb" id="theme-color" />
    <title>PrepHub — Make your next move</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        const savedTheme = localStorage.getItem("prephub-theme");
        document.documentElement.dataset.theme =
          savedTheme === "light" || savedTheme === "dark"
            ? savedTheme
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
      } catch (error) {
        console.error("Could not load your saved theme preference.", error);
        document.documentElement.dataset.theme = window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
      }
    </script>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Main navigation">
        <a class="brand" href="#dashboard" aria-label="PrepHub home">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 36 36" fill="none">
              <path d="M8 9.5C8 8.672 8.672 8 9.5 8h17a1.5 1.5 0 0 1 1.5 1.5v17a1.5 1.5 0 0 1-1.5 1.5h-17A1.5 1.5 0 0 1 8 26.5v-17Z" fill="currentColor" />
              <path d="M13 22V14h5.2a2.4 2.4 0 1 1 0 4.8H13" stroke="#17221D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
              <path d="m21 22 2.5-8 2.5 8m-4.2-2h3.4" stroke="#17221D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </span>
          <span>prep<span class="brand-light">hub</span></span>
        </a>

        <p class="nav-label">WORKSPACE</p>
        <nav class="nav-list">
          <a class="nav-link is-active" href="#dashboard" data-view="dashboard">
            <span class="nav-icon" aria-hidden="true">⌂</span>
            <span>Overview</span>
          </a>
          <a class="nav-link" href="#interviews" data-view="interviews">
            <span class="nav-icon" aria-hidden="true">✳</span>
            <span>Interview prep</span>
          </a>
          <a class="nav-link" href="#questions" data-view="questions">
            <span class="nav-icon" aria-hidden="true">?</span>
            <span>Practice Questions</span>
          </a>
          <a class="nav-link" href="#applications" data-view="applications">
            <span class="nav-icon" aria-hidden="true">↗</span>
            <span>Applications &amp; Outreach</span>
          </a>
          <a class="nav-link" href="#opportunities" data-view="opportunities">
            <span class="nav-icon" aria-hidden="true">◇</span>
            <span>Opportunities</span>
          </a>
          <a class="nav-link" href="#planner" data-view="planner">
            <span class="nav-icon" aria-hidden="true">▦</span>
            <span>Study planner</span>
          </a>
          <a class="nav-link" href="#resources" data-view="resources">
            <span class="nav-icon" aria-hidden="true">◇</span>
            <span>My resources</span>
          </a>
        </nav>

        <div class="sidebar-bottom">
          <div class="streak-card demo-card">
            <div class="streak-top">
              <span class="streak-icon" aria-hidden="true">✦</span>
              <span class="streak-number">Demo workspace</span>
            </div>
            <p>Sample records are labeled. Your edits stay in this browser.</p>
          </div>
          <div class="profile-button">
            <span class="avatar">PH</span>
            <span class="profile-copy">
              <strong>PrepHub Demo</strong>
              <span>Sample workspace</span>
            </span>
            <span class="profile-more" aria-hidden="true">···</span>
          </div>
        </div>
      </aside>

      <main class="main-area">
        <header class="topbar">
          <div class="breadcrumb">
            <span>Workspace</span>
            <span class="breadcrumb-divider" aria-hidden="true">/</span>
            <strong id="breadcrumb-current">Overview</strong>
          </div>
          <div class="topbar-actions">
            <label class="search-box">
              <span aria-hidden="true">⌕</span>
              <input id="global-search" type="search" placeholder="Search resources..." aria-label="Search resources" />
              <kbd>/</kbd>
            </label>
            <button class="icon-button theme-toggle" type="button" data-action="toggle-theme" aria-label="Switch to dark mode" title="Switch to dark mode" aria-pressed="false">
              <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.7" />
                <path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
              </svg>
              <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M20.2 15.1A8.5 8.5 0 0 1 8.9 3.8 8.5 8.5 0 1 0 20.2 15.1Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </button>
            <button class="icon-button notification-button" type="button" data-action="notifications" aria-label="Notifications">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9Zm-8 13h4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
              <span class="notification-dot"></span>
            </button>
          </div>
        </header>

        <div class="page-content" id="page-content" tabindex="-1"></div>
      </main>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
